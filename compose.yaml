name: gloria

services:
  # ── Main Browser Environment ──────────────────────────────
  gloria-browser:
    image: sh7vansh/gloria:latest
    build:
      context: ./browser
      dockerfile: Dockerfile
    container_name: gloria-browser
    hostname: gloria-browser
    environment:
      - DISPLAY=${GLORIA_DISPLAY:-:1}
      - GLORIA_SCREEN_WIDTH=${GLORIA_SCREEN_WIDTH:-1920}
      - GLORIA_SCREEN_HEIGHT=${GLORIA_SCREEN_HEIGHT:-1080}
      - GLORIA_SCREEN_DEPTH=${GLORIA_SCREEN_DEPTH:-24}
      - GLORIA_VNC_PORT=${GLORIA_VNC_PORT:-5901}
      - GLORIA_MCP_PORT=${GLORIA_MCP_PORT:-8787}
      - GLORIA_DATA=${GLORIA_DATA:-/data}
      - GLORIA_VNC_PASSWORD=${GLORIA_VNC_PASSWORD:-gloria}
      - HOME=/home/gloria
    volumes:
      - gloria-data:${GLORIA_DATA:-/data}
    ports:
      - "${GLORIA_WEB_PORT:-8080}:8080"
      - "${GLORIA_MCP_PORT:-8787}:8787"
      - "${GLORIA_VNC_PORT:-5901}:5901"
    networks:
      - gloria-net
    shm_size: '2gb'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "/opt/gloria/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  gloria-data:
    name: gloria-data

networks:
  gloria-net:
    name: gloria-net
    driver: bridge
