[supervisord]
nodaemon=true
user=root
logfile=/data/gloria/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/data/gloria/logs
logfile_maxbytes=10MB
logfile_backups=3

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ── DBus ────────────────────────────────────────────────────────────────────
[program:dbus]
command=/usr/bin/dbus-daemon --system --nofork
user=root
autorestart=true
priority=10
stdout_logfile=/data/gloria/logs/dbus.log
stderr_logfile=/data/gloria/logs/dbus.err

# ── Xvfb (Virtual Framebuffer) ──────────────────────────────────────────────
[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_GLORIA_SCREEN_WIDTH)sx%(ENV_GLORIA_SCREEN_HEIGHT)sx%(ENV_GLORIA_SCREEN_DEPTH)s -ac +extension GLX +render -noreset
user=gloria
autorestart=true
priority=20
stdout_logfile=/data/gloria/logs/xvfb.log
stderr_logfile=/data/gloria/logs/xvfb.err

# ── XFCE Desktop ────────────────────────────────────────────────────────────
[program:xfce]
command=/usr/bin/startxfce4
user=gloria
environment=HOME="/home/gloria",DISPLAY="%(ENV_DISPLAY)s",DBUS_SESSION_BUS_ADDRESS="autolaunch:"
autorestart=true
priority=30
startsecs=5
startretries=3
stdout_logfile=/data/gloria/logs/xfce.log
stderr_logfile=/data/gloria/logs/xfce.err

# ── VNC Server ──────────────────────────────────────────────────────────────
[program:vnc]
command=/opt/gloria/scripts/start-vnc.sh
user=gloria
environment=HOME="/home/gloria",DISPLAY="%(ENV_DISPLAY)s"
autorestart=true
priority=40
startsecs=3
stdout_logfile=/data/gloria/logs/vnc.log
stderr_logfile=/data/gloria/logs/vnc.err

# ── noVNC (Zero-Authentication HTML5 Web Desktop) ───────────────────────────
[program:novnc]
command=/opt/gloria/scripts/start-novnc.sh
user=gloria
environment=HOME="/home/gloria",DISPLAY="%(ENV_DISPLAY)s"
autorestart=true
priority=45
startsecs=2
stdout_logfile=/data/gloria/logs/novnc.log
stderr_logfile=/data/gloria/logs/novnc.err

# ── Chromium ────────────────────────────────────────────────────────────────
[program:chromium]
command=/opt/gloria/scripts/start-chromium.sh
user=gloria
environment=HOME="/home/gloria",DISPLAY="%(ENV_DISPLAY)s"
autorestart=true
priority=50
startsecs=5
startretries=5
stdout_logfile=/data/gloria/logs/chromium.log
stderr_logfile=/data/gloria/logs/chromium.err

# ── MCP Proxy ───────────────────────────────────────────────────────────────
[program:mcp-proxy]
command=/opt/gloria/scripts/start-mcp-proxy.sh
user=gloria
environment=HOME="/home/gloria",DISPLAY="%(ENV_DISPLAY)s",PATH="/home/gloria/.local/bin:/usr/local/bin:/usr/bin:/bin"
autorestart=true
priority=60
startsecs=3
startretries=5
stdout_logfile=/data/gloria/logs/mcp-proxy.log
stderr_logfile=/data/gloria/logs/mcp-proxy.err
